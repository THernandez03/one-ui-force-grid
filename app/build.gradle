plugins { id 'com.android.application' }

def signingKeystorePath = System.getenv('SIGNING_KEYSTORE_PATH')
def signingStorePassword = System.getenv('SIGNING_STORE_PASSWORD')
def signingKeyAlias = System.getenv('SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('SIGNING_KEY_PASSWORD')
def hasReleaseSigning = [signingKeystorePath, signingStorePassword, signingKeyAlias, signingKeyPassword].every { it != null && !it.isEmpty() } &&
        file(signingKeystorePath).exists()

android {
    namespace 'com.example.homeupprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.homeupprobe'
        minSdk 29
        targetSdk 28
        versionCode 3
        versionName '0.3'
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingKeystorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    lint {
        // targetSdk 28 is intentional, this app is not distributed via Google Play.
        disable 'ExpiredTargetSdkVersion'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Fall back to the debug key when the signing env vars are absent, so local builds still work.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}
